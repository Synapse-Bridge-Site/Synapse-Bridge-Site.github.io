<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synapse Bridge - Decentralized DeFi Portal</title>
  <meta name="description" content="Secure, non-custodial portal for Synapse Bridge DeFi operations directly from your own wallet.">
  <link rel="canonical" href="https://synapse-bridge-site.github.io/">
  <meta name="robots" content="index,follow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="prefetch" href="dashboard/">
  <link rel="prerender" href="dashboard/">
  <style>


:root {
  --bg: #09060F;
  --bg-2: #120A1D;
  --panel: rgba(255, 255, 255, 0.055);
  --panel-strong: rgba(255, 255, 255, 0.085);
  --text: #F7F2FA;
  --muted: #B9ADBF;
  --quiet: #82768A;
  --line: rgba(247, 242, 250, 0.13);
  --line-strong: rgba(247, 242, 250, 0.2);
  --accent: #FF0099;
  --accent-deep: #C80078;
  --tint: #734CE2;
  --shadow: 0 32px 90px -44px rgba(255, 0, 153, 0.7);
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  min-height: 100dvh;
  margin: 0;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr auto;
  color: var(--text);
  background:
    radial-gradient(circle at 50% -12%, rgba(255, 0, 153, 0.2), transparent 34rem),
    radial-gradient(circle at 10% 110%, rgba(115, 76, 226, 0.14), transparent 28rem),
    linear-gradient(180deg, var(--bg-2), var(--bg) 48%, #060409);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  display: block;
  max-width: 100%;
}

p,
h1 {
  margin: 0;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  min-width: 0;
  padding: 18px clamp(18px, 4vw, 46px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  font-size: 0.98rem;
  font-weight: 700;
  letter-spacing: 0;
  white-space: nowrap;
}

.brand img {
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  box-shadow: 0 0 0 1px var(--line);
}

.nav {
  display: flex;
  align-items: center;
  gap: clamp(18px, 3vw, 30px);
  min-width: 0;
}

.nav a {
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 500;
  white-space: nowrap;
  transition: color 160ms ease;
}

.nav a:hover {
  color: var(--text);
}

.spacer {
  flex: 1;
}

.ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 38px;
  padding: 0 17px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  color: var(--text);
  background: rgba(255, 255, 255, 0.035);
  font-size: 0.9rem;
  font-weight: 700;
  white-space: nowrap;
  transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
}

.ghost:hover {
  border-color: rgba(255, 0, 153, 0.55);
  background: rgba(255, 0, 153, 0.09);
  transform: translateY(-1px);
}

.stage {
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px clamp(18px, 4vw, 46px);
  text-align: center;
}

.hero {
  width: min(760px, 100%);
}

h1 {
  font-size: clamp(3rem, 7vw, 5.35rem);
  font-weight: 800;
  line-height: 0.98;
  letter-spacing: 0;
}

.value {
  max-width: 56ch;
  margin: 18px auto 0;
  color: var(--muted);
  font-size: clamp(1rem, 1.7vw, 1.18rem);
}

.value strong {
  color: var(--text);
  font-weight: 800;
}

.app-card {
  width: min(590px, 100%);
  margin-top: 34px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 24px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.082), rgba(255, 255, 255, 0.045)),
    rgba(9, 6, 15, 0.72);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(18px);
}

.route {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr);
  align-items: center;
  gap: 12px;
}

.leg {
  min-width: 0;
  padding: 14px 15px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
  text-align: left;
}

.label {
  display: block;
  color: var(--quiet);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.chip {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  margin-top: 9px;
  color: var(--text);
  font-size: 1.12rem;
  font-weight: 800;
}

.chip img {
  width: 28px;
  height: 28px;
  flex: none;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16);
}

.switch {
  width: 44px;
  height: 44px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  color: var(--text);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.025)),
    #0F0A17;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: border-color 160ms ease, color 160ms ease, transform 180ms ease;
}

.switch span {
  display: block;
  font-size: 1.15rem;
  line-height: 1;
}

.switch:hover {
  border-color: rgba(255, 0, 153, 0.64);
  color: var(--accent);
  transform: scale(1.04);
}

.primary {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 54px;
  width: 100%;
  margin-top: 16px;
  border-radius: 16px;
  color: white;
  background: linear-gradient(180deg, var(--accent), var(--accent-deep));
  font-size: 1rem;
  font-weight: 800;
  box-shadow: 0 18px 42px -24px rgba(255, 0, 153, 0.95);
  transition: transform 160ms ease, filter 160ms ease;
}

.primary:hover {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

.note {
  margin-top: 11px;
  color: var(--quiet);
  font-size: 0.78rem;
  font-weight: 600;
}

.footer {
  padding: 16px 24px 22px;
  color: var(--quiet);
  text-align: center;
  font-size: 0.84rem;
  font-weight: 600;
}

@media (max-width: 760px) {
  .nav {
    display: none;
  }

  .topbar {
    gap: 12px;
    padding-top: 14px;
    padding-bottom: 12px;
  }
}

@media (max-width: 520px) {
  .brand span {
    max-width: 152px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ghost {
    min-height: 36px;
    padding-inline: 14px;
    font-size: 0.86rem;
  }

  .stage {
    padding-top: 4px;
    padding-bottom: 4px;
  }

  h1 {
    font-size: clamp(2.45rem, 14vw, 3.55rem);
  }

  .value {
    margin-top: 14px;
    font-size: 0.98rem;
    line-height: 1.45;
  }

  .app-card {
    margin-top: 24px;
    padding: 15px;
    border-radius: 20px;
  }

  .route {
    grid-template-columns: 1fr;
    gap: 9px;
  }

  .leg {
    padding: 12px 13px;
  }

  .switch {
    width: 38px;
    height: 38px;
    justify-self: center;
  }

  .switch span {
    transform: rotate(90deg);
  }

  .primary {
    min-height: 50px;
    margin-top: 13px;
  }

  .note {
    margin-top: 8px;
  }

  .footer {
    padding-top: 10px;
    padding-bottom: 14px;
  }
}

@media (max-height: 720px) {
  .topbar {
    padding-top: 12px;
    padding-bottom: 10px;
  }

  h1 {
    font-size: clamp(2.35rem, 6vw, 4.2rem);
  }

  .value {
    margin-top: 12px;
  }

  .app-card {
    margin-top: 22px;
  }

  .footer {
    padding-top: 10px;
    padding-bottom: 14px;
  }
}


  
.footer {
  text-align: center !important;
}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="favicon.png" width="30" height="30" alt="">
      <span>Synapse Bridge</span>
    </div>
    <span class="spacer"></span>
    <nav class="nav" aria-label="Main Navigation">
      <a href="how-it-works/">How it works</a>
      <a href="faq/">FAQ</a>
      <a href="about/">About</a>
      <a href="security/">Security</a>
      <a href="supported-chains/">Supported Chains</a>
    </nav>
  </header>
  <main class="stage" style="padding: 100px 24px; text-align: center; max-width: 800px; margin: 0 auto;">
    <h1 style="font-size: clamp(2.5rem, 6vw, 4.5rem); margin-bottom: 24px; font-weight: 800;">Synapse Bridge</h1>
    <p class="value" style="font-size: 1.25rem; opacity: 0.8; margin-bottom: 40px; line-height: 1.6;">Secure, non-custodial gateway for decentralized operations. Connect your Web3 wallet to enter the portal.</p>
    <a class="open-app" href="dashboard/" style="display: inline-flex; justify-content: center; align-items: center; min-height: 52px; padding: 0 32px; border-radius: 9999px; background: var(--accent, #625bf3); color: #fff; font-weight: 700; text-decoration: none; font-size: 1.1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.15); transition: transform 0.2s ease;">Open App Dashboard</a>
  </main>
  <footer class="footer">Synapse Bridge &mdash; 2026</footer>
</body>
</html>
